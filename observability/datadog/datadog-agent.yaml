apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: square-kr
    site: us5.datadoghq.com

    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key

    kubelet:
      tlsVerify: false

  features:
    apm:
      enabled: true
    clusterChecks:
      enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    processDiscovery:
      enabled: false
    otelCollector:
      enabled: true

  override:
    nodeAgent:
      env:
        - name: DD_IGNORE_AUTOCONF
          value: "kubernetes_state"
      volumes:
        - name: postgresql-monitor-secret
          secret:
            secretName: datadog-secret
            items:
              - key: postgres-password
                path: postgres-password
      containers:
        agent:
          env:
            - name: DD_SECRET_BACKEND_COMMAND
              value: /readsecret.py
            - name: DD_SECRET_BACKEND_ARGUMENTS
              value: /etc/datadog-agent/secrets
          volumeMounts:
            - name: postgresql-monitor-secret
              mountPath: /etc/datadog-agent/secrets
              readOnly: true
      tolerations:
        - operator: Exists
    clusterAgent:
      volumes:
        - name: cluster-agent-confd
          emptyDir: {}
      containers:
        cluster-agent:
          volumeMounts:
            - name: cluster-agent-confd
              mountPath: /etc/datadog-agent/conf.d
      extraConfd:
        configDataMap:
          postgres.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - host: 10.20.0.45
                port: 5432
                username: square_datadog
                password: "ENC[postgres-password]"
                dbname: square_notification
                dbstrict: true
                ssl: require
                dbm: true
                reported_hostname: squarek8s-postgresql
                tags:
                  - env:dev
                  - service:postgresql
