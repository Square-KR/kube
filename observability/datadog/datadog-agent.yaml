apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: square-kr
    site: us5.datadoghq.com

    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key

    kubelet:
      tlsVerify: false

  features:
    apm:
      enabled: true
    clusterChecks:
      enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    processDiscovery:
      enabled: false
    otelCollector:
      enabled: true

  override:
    nodeAgent:
      env:
        - name: DD_IGNORE_AUTOCONF
          value: "kubernetes_state"
        - name: DD_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datadog-secret
              key: postgres-password
      tolerations:
        - operator: Exists
    clusterAgent:
      env:
        - name: DD_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datadog-secret
              key: postgres-password
      volumes:
        - name: cluster-agent-confd
          emptyDir: {}
      containers:
        cluster-agent:
          volumeMounts:
            - name: cluster-agent-confd
              mountPath: /etc/datadog-agent/conf.d
      extraConfd:
        configDataMap:
          postgres.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - host: 10.20.0.45
                port: 5432
                username: square_datadog
                password: "%%env_DD_POSTGRES_PASSWORD%%"
                dbname: square_notification
                dbstrict: true
                ssl: require
                dbm: true
                reported_hostname: squarek8s-postgresql
                tags:
                  - env:dev
                  - service:postgresql
