apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: square-kr
    site: us5.datadoghq.com

    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key

    kubelet:
      tlsVerify: false

  features:
    apm:
      enabled: true
    clusterChecks:
      enabled: false
    logCollection:
      enabled: true
      containerCollectAll: true
    processDiscovery:
      enabled: false
    # Agent 7.78부터 기본으로 켜지고 system-probe 컨테이너가 추가된다. 1 OCPU 워커의 CPU 여유가 적어 끈다.
    serviceDiscovery:
      enabled: false
    otelCollector:
      enabled: true

  override:
    nodeAgent:
      # container_t로 /host/proc를 읽으면 SELinux 거부 기록이 초당 수십 건 쌓여 워커의 setroubleshootd가 CPU를 소모한다.
      securityContext:
        runAsUser: 0
        seLinuxOptions:
          user: system_u
          role: system_r
          type: spc_t
          level: s0
      env:
        - name: DD_IGNORE_AUTOCONF
          value: "kubernetes_state redisdb"
      tolerations:
        - operator: Exists
