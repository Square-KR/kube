apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: square-kr
    site: us5.datadoghq.com

    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key

    kubelet:
      tlsVerify: false

  features:
    apm:
      enabled: true
    clusterChecks:
      enabled: false
    logCollection:
      enabled: true
      containerCollectAll: true
    processDiscovery:
      enabled: false
    # Agent 7.78부터 기본으로 켜지고 system-probe 컨테이너가 추가된다. 1 OCPU 워커의 CPU 여유가 적어 끈다.
    serviceDiscovery:
      enabled: false
    otelCollector:
      enabled: true

  override:
    nodeAgent:
      # container_t로 /host/proc를 읽으면 SELinux 거부 기록이 초당 수십 건 쌓여 워커의 setroubleshootd가 CPU를 소모한다.
      securityContext:
        runAsUser: 0
        seLinuxOptions:
          user: system_u
          role: system_r
          type: spc_t
          level: s0
      env:
        - name: DD_IGNORE_AUTOCONF
          value: "kubernetes_state redisdb"
        # OKE 관리 컴포넌트의 info 로그(CoreDNS 쿼리 로그, observability discovery agent)가 전체 로그의 약 77%다.
        - name: DD_CONTAINER_EXCLUDE_LOGS
          value: "name:^coredns$ name:^discovery-agent$"
        # operator 1.31.2는 serviceDiscovery를 꺼도 Agent 기본값(discovery.enabled: true)을 덮어쓰지 않는다. Agent가 없는 system-probe 소켓을 계속 호출해 error 로그를 남긴다.
        - name: DD_DISCOVERY_ENABLED
          value: "false"
      tolerations:
        - operator: Exists
