name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.1.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate manifests
        run: scripts/validate-manifests.sh

      - name: Check shell scripts
        run: shellcheck -S warning bootstrap.sh scripts/*.sh terraform/worker-init.sh

      - name: Test GHCR cleanup
        run: scripts/test-cleanup-ghcr.sh
