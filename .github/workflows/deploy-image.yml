name: deploy-image

on:
  repository_dispatch:
    types: ["deploy-image"]
  workflow_dispatch:
    inputs:
      service:
        description: Service directory under projects/
        required: true
        type: string
      environment:
        description: Deployment environment
        required: true
        type: string
      version:
        description: Image tag to deploy
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.event.client_payload.service || inputs.service }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Validate payload
        id: payload
        env:
          SERVICE: ${{ github.event.client_payload.service || inputs.service }}
          ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$SERVICE" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid service: $SERVICE" >&2
            exit 1
          fi

          if [[ ! "$ENVIRONMENT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid environment: $ENVIRONMENT" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          VALUES_FILE="projects/${SERVICE}/${ENVIRONMENT}/values.yaml"
          KUSTOMIZATION_FILE="projects/${SERVICE}/${ENVIRONMENT}/kustomization.yaml"

          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "Missing values file: $VALUES_FILE" >&2
            exit 1
          fi

          {
            echo "service=$SERVICE"
            echo "environment=$ENVIRONMENT"
            echo "version=$VERSION"
            echo "values_file=$VALUES_FILE"
            echo "kustomization_file=$KUSTOMIZATION_FILE"
            [[ -f "$KUSTOMIZATION_FILE" ]] && echo "has_kustomization=true" || true
          } >> "$GITHUB_OUTPUT"

      - name: Update image version
        uses: mikefarah/yq@v4.46.1
        with:
          cmd: yq -i '.image.version = "${{ steps.payload.outputs.version }}"' '${{ steps.payload.outputs.values_file }}'

      - name: Update workload image version
        if: steps.payload.outputs.has_kustomization == 'true'
        uses: mikefarah/yq@v4.46.1
        with:
          cmd: yq -i '.images[0].newTag = "${{ steps.payload.outputs.version }}"' '${{ steps.payload.outputs.kustomization_file }}'

      - name: Commit and push changes
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No image update needed."
            exit 0
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add "${{ steps.payload.outputs.values_file }}"
          if [[ -f "${{ steps.payload.outputs.kustomization_file }}" ]]; then
            git add "${{ steps.payload.outputs.kustomization_file }}"
          fi
          git commit -m "chore(bot): update ${{ steps.payload.outputs.service }} image to ${{ steps.payload.outputs.version }}"
          git push origin main
