apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: ghcr-pull-secret
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  externalSecretName: ghcr-pull-secret
  namespaceSelectors:
    - matchLabels:
        square-kr.io/ghcr-pull-secret: "true"
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: aws-ssm
      kind: ClusterSecretStore
    target:
      name: ghcr-pull-secret
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: |
            {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
    data:
      - secretKey: username
        remoteRef:
          key: /infrastructure/ghcr/username
      - secretKey: token
        remoteRef:
          key: /infrastructure/ghcr/token
