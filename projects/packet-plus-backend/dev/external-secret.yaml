apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: packet-plus-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: packet-plus-backend
  dataFrom:
    - find:
        name:
          regexp: "^/dev/packet-plus-backend/"
      rewrite:
        - regexp:
            source: "^/dev/packet-plus-backend/(.*)"
            target: "$1"
