# 프로젝트 중지: 재개할 때 replicas를 1로 복원한다.
replicas: 0
port: 3000
healthCheck:
  liveness: /health/live
  readiness: /health/ready
  timeoutSeconds: 2
image:
  name: ghcr.io/square-kr/packet-plus-backend
  version: "50617403"
resources:
  cpu: "100m"
  memory: "256Mi"
secrets:
  - packet-plus-backend
imagePullSecrets:
  - ghcr-pull-secret
