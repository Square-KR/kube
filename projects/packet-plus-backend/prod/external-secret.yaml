# ponytail: production shares notification-backend.dev until a prod deployment exists; then update NOTIFICATION_BASE_URL in SSM.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: packet-plus-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: packet-plus-backend
  dataFrom:
    - find:
        name:
          regexp: "^/prod/packet-plus-backend/"
      rewrite:
        - regexp:
            source: "^/prod/packet-plus-backend/(.*)"
            target: "$1"
