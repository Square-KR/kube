apiVersion: batch/v1
kind: Job
metadata:
  name: packet-plus-database-migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: packet-plus-backend
        app.kubernetes.io/name: packet-plus-backend
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migration
          image: ghcr.io/square-kr/packet-plus-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - --enable-source-maps
            - --import
            - ./dist/instrument.js
            - dist/db-migration.js
          envFrom:
            - secretRef:
                name: packet-plus-backend
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
