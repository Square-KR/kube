# 학교 계정 수집기와 rate limit 상태가 프로세스 메모리에 있으므로 1을 넘기지 않는다.
replicas: 1
healthCheck:
  liveness: /api/health
  readiness: /api/health
  timeoutSeconds: 3
image:
  name: ghcr.io/square-kr/honami
  version: "8d091dcb"
resources:
  cpu: "100m"
  memory: "512Mi"
env:
  - name: PORT
    value: "3000"
  # Kubernetes가 HOSTNAME을 파드 이름으로 채우는데 Next.js standalone 서버가 이 값에 바인딩한다.
  - name: HOSTNAME
    value: "0.0.0.0"
  - name: BETTER_AUTH_URL
    value: https://mllm.kr
secrets:
  - honami
imagePullSecrets:
  - ghcr-pull-secret
