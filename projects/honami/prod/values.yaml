port: 3000
# Set to 1 after the first image is published. Never above 1: the school-account
# collector and rate limits live in process memory.
replicas: 0
healthCheck:
  liveness: /api/health
  readiness: /api/health
  timeoutSeconds: 3
image:
  name: ghcr.io/square-kr/honami
  version: bootstrap
resources:
  cpu: "100m"
  memory: "512Mi"
env:
  - name: PORT
    value: "3000"
  # Kubernetes sets HOSTNAME to the pod name; the Next.js standalone server binds to it.
  - name: HOSTNAME
    value: "0.0.0.0"
  - name: BETTER_AUTH_URL
    value: https://mllm.kr
secrets:
  - honami
imagePullSecrets:
  - ghcr-pull-secret
