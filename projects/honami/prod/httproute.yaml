apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: honami
  namespace: prod
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http
      namespace: infra
      sectionName: mllm-kr-https
  hostnames:
    - mllm.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: honami
          port: 80
