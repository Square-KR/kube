apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: honami
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: honami
  dataFrom:
    - find:
        name:
          regexp: "^/prod/honami/"
      rewrite:
        - regexp:
            source: "^/prod/honami/(.*)"
            target: "$1"
