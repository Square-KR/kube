apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: notification-backend
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: projects
    app.kubernetes.io/component: notification-service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - list:
        elements:
          - env: dev

  template:
    metadata:
      name: notification-backend-{{.env}}
      labels:
        app.kubernetes.io/part-of: projects
        app.kubernetes.io/component: notification-service
        app.kubernetes.io/instance: "{{.env}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      sources:
        - repoURL: https://github.com/Square-KR/kube
          targetRevision: HEAD
          ref: repo

        - repoURL: https://github.com/Square-KR/kube
          targetRevision: HEAD
          path: charts/app
          helm:
            releaseName: notification-backend
            valueFiles:
              - $repo/projects/notification-backend/{{.env}}/values.yaml

        - repoURL: https://github.com/Square-KR/kube
          targetRevision: HEAD
          path: projects/notification-backend/{{.env}}
          directory:
            exclude: values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.env}}"

      # Argo Rollouts와 Reloader가 쓰는 필드다. selfHeal이 지우면 blue-green 전환과 시크릿 재시작이 되돌려진다.
      ignoreDifferences:
        - kind: Service
          jsonPointers:
            - /spec/selector/rollouts-pod-template-hash
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from

      syncPolicy:
        managedNamespaceMetadata:
          labels:
            square-kr.io/ghcr-pull-secret: "true"
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
