apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http
      namespace: infra
      sectionName: sqr-kr-wildcard-https
  hostnames:
    - argocd.sqr.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Envoy Gateway 기본 요청 타임아웃 15초가 ArgoCD UI의 watch 스트림과 로그 follow를 끊어 504가 반복된다.
      timeouts:
        request: 0s
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
