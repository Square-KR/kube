apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: oracle-lb
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          # externalTrafficPolicy가 Local이라 프록시가 없는 노드는 LB 헬스체크에서 빠진다. 노드마다 하나씩 둔다.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  app.kubernetes.io/component: proxy
              matchLabelKeys:
                - pod-template-hash
      envoyPDB:
        minAvailable: 1
      envoyService:
        annotations:
          oci.oraclecloud.com/oci-network-security-groups: ocid1.networksecuritygroup.oc1.ap-seoul-1.aaaaaaaa5db57tpu7fkxjxs3svo4vjtkkix6oithqp5nqna47usnqc4eqx3q
          oci.oraclecloud.com/security-rule-management-mode: "None"
          service.beta.kubernetes.io/oci-load-balancer-shape: flexible
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: oracle-lb
    namespace: envoy-gateway-system
